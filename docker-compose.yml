name: url-shortener

services:
  # 🗄️ MongoDB Service
  mongo_db:
    container_name: mongo_db_container
    image: mongo:latest
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db

  # 🔁 Redis Service
  redis_server:
    container_name: redis_container
    image: redis:alpine
    restart: always
    ports:
      - 6379:6379

  # 🚀 Node.js API Service
  url_shortener_app:
    build: .
    image: url-shortener-app:latest
    container_name: url_shortener_container
    command: npm run dev
    ports:
      - 3000:3000
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    depends_on:
      - mongo_db
      - redis_server

volumes:
  mongodb_data:
    name: url_shortener_mongodb_data
